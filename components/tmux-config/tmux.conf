# ~/.tmux.conf — managed by dotmeow
# Requires tmux 3.7+ — the pickers and lazygit open with `new-pane` (floating
# panes, added in 3.7) and the status bar reads #{pane_floating_flag}.

# ── Prefix ────────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind -N "Send the prefix key through" C-a send-prefix

# ── Core ──────────────────────────────────────────────────────────────────────
# default-shell is set in ~/.config/tmux/local.conf (generated by meowctl apply)
# so the path is detected at install time rather than hardcoded here.
if-shell "test -f ~/.config/tmux/local.conf" "source-file ~/.config/tmux/local.conf"
# Strip meowctl's once-only guard from the pane environment so each new pane
# re-runs `meowctl hook shell` and gets starship/mise/zoxide initialised.
set-environment -gu _MEOWCTL_SHELL_DONE
set -g default-terminal "tmux-256color"
# Outer terminal is Ghostty (TERM=xterm-ghostty); its terminfo already declares
# RGB truecolor + styled underlines. Declare RGB explicitly so tmux never
# second-guesses the outer terminal's colour depth.
set -as terminal-features ",xterm-ghostty:RGB"
# Programs inside tmux see tmux-256color, which lacks truecolor AND styled
# underlines. Patch both in so Ghostty's capabilities reach nvim etc.:
#   Tc     — 24-bit colour
#   Smulx  — undercurl / styled underlines
#   Setulc — coloured underlines
set -ga terminal-overrides ",tmux-256color:Tc"
set -ga terminal-overrides ",*:Smulx=\\E[4::%p1%dm"
set -ga terminal-overrides ",*:Setulc=\\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m"
# Assert truecolor for programs that sniff $COLORTERM (e.g. meowvim gates
# termguicolors on it). COLORTERM is NOT in update-environment, so a tmux
# server started outside Ghostty would otherwise drop it inside panes and
# nvim would fall back to 256 colours.
set-environment -g COLORTERM truecolor
# Ghostty speaks the Kitty graphics protocol; without passthrough tmux strips
# those escapes and images inside nvim (image.nvim, snacks previews) never draw.
set -g allow-passthrough on
# Killing a session (prefix Q) switches to another one instead of dropping the
# client back to a bare shell — the sesh workflow assumes you land somewhere.
set -g detach-on-destroy off
# Flag windows where something happened while you were looking elsewhere.
# visual-activity stays off: the marker in the status line is enough, a message
# overlay on every background build would not be.
set -g monitor-activity on
set -g visual-activity off
set -g history-limit 50000
set -g mouse on
set -g focus-events on
# OSC 52 clipboard passthrough — pairs with Ghostty's `clipboard-read = allow` /
# clipboard-write, so a nvim/CLI yank inside tmux reaches the macOS clipboard.
# (tmux-yank/thumbs still use pbcopy directly; this covers OSC 52 emitters.)
set -g set-clipboard on
set -g status-position top
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# 0 ms escape-time; tmux-sensible also sets this — kept here to be explicit.
set -sg escape-time 0
set -g status-interval 1

# ── Vi mode ───────────────────────────────────────────────────────────────────
set -g mode-keys vi
bind -N "Enter copy mode" [ copy-mode
bind -T copy-mode-vi -N "Begin selection" v   send -X begin-selection
bind -T copy-mode-vi -N "Select whole line" V   send -X select-line
bind -T copy-mode-vi -N "Toggle block selection" C-v send -X rectangle-toggle
# y is handled by tmux-yank (loaded via TPM below); configure via @yank_action.
bind -T copy-mode-vi -N "Copy whole line to clipboard" Y   send -X select-line \; send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi -N "Search down" /   run-shell "~/.config/tmux/scripts/tmux-float.sh 60 20 ~/.config/tmux/scripts/tmux-search.sh #{pane_id} forward"
bind -T copy-mode-vi -N "Search up" ?   run-shell "~/.config/tmux/scripts/tmux-float.sh 60 20 ~/.config/tmux/scripts/tmux-search.sh #{pane_id} backward"
bind -T copy-mode-vi -N "Leave copy mode" Escape send -X cancel
# Copy mode keeps tmux's own prompt for the counts (1-9) and the character jumps
# (f F t T): those take a single key or accumulate digits as you type, and a
# floating pane would put an Enter in the middle of a vi motion.
bind -T copy-mode-vi -N "Go to line" : run-shell "~/.config/tmux/scripts/tmux-float.sh 50 20 ~/.config/tmux/scripts/tmux-input.sh 'Go to line' '' 'send-keys -X -t #{pane_id} goto-line @@'"

# ── Pane navigation ───────────────────────────────────────────────────────────
# vim-tmux-navigator handles Ctrl-hjkl without prefix.
# prefix + hjkl as an explicit fallback.
bind -N "Select pane to the left" h select-pane -L
bind -N "Select pane below" j select-pane -D
bind -N "Select pane above" k select-pane -U
bind -N "Select pane to the right" l select-pane -R

# ── Pane splits ───────────────────────────────────────────────────────────────
# Named for where the pane lands: `split-window -h` is "horizontal" in tmux's
# wording but puts the new pane on the right.
unbind '"'
unbind %
bind -N "Split right (same directory)" | split-window -h -c "#{pane_current_path}"
bind -N "Split right (same directory)" v split-window -h -c "#{pane_current_path}"
bind -N "Split down (same directory)" - split-window -v -c "#{pane_current_path}"
# 's' intentionally shadows the default choose-tree binding.
bind -N "Split down (same directory)" s split-window -v -c "#{pane_current_path}"

# ── Pane resize (repeatable) ──────────────────────────────────────────────────
bind -r -N "Resize pane left" H resize-pane -L 5
bind -r -N "Resize pane down" J resize-pane -D 5
bind -r -N "Resize pane up" K resize-pane -U 5
bind -r -N "Resize pane right" L resize-pane -R 5

# ── Windows ───────────────────────────────────────────────────────────────────
bind -N "New window (same directory)" c new-window -c "#{pane_current_path}"
bind -N "Next window" n next-window
bind -N "Previous window" p previous-window
bind -N "Kill pane" x kill-pane
bind -N "Kill window" X kill-window
bind -N "Zoom pane" z resize-pane -Z
# fzf in a floating pane, with name suggestions; W picks the window first.
bind -N "Rename window" , run-shell "~/.config/tmux/scripts/tmux-float.sh 70 50 ~/.config/tmux/scripts/tmux-window-rename.sh"
bind -N "Rename any window (picker)" W run-shell "~/.config/tmux/scripts/tmux-float.sh 70 50 ~/.config/tmux/scripts/tmux-window-rename.sh --pick"

# ── Session management (sesh) ─────────────────────────────────────────────────
bind -N "Detach client" d   detach-client
bind -N "Switch session (picker)" w   run-shell "~/.config/tmux/scripts/tmux-float.sh 80 60 ~/.config/tmux/scripts/tmux-session-picker.sh"
bind -N "Last session" Tab run-shell "~/.config/tmux/scripts/tmux-sesh-last.sh"
bind -N "Next session" N   switch-client -n
bind -N "Previous session" P   switch-client -p
bind -N "Rename session" "$" run-shell "~/.config/tmux/scripts/tmux-float.sh 70 50 ~/.config/tmux/scripts/tmux-session-rename.sh"
bind -N "Kill session" Q  run-shell "~/.config/tmux/scripts/tmux-float.sh 50 30 ~/.config/tmux/scripts/tmux-confirm.sh 'Kill session #{session_name}?' \"run-shell '~/.config/tmux/scripts/tmux-sesh-last.sh'; kill-session\""

# ── Key hints (which-key) ─────────────────────────────────────────────────────
# Generated from the live key tables, so it cannot drift from the binds above.
bind -N "Show key bindings" ? run-shell "~/.config/tmux/scripts/tmux-float.sh 80 70 ~/.config/tmux/scripts/tmux-which-key.sh"

# ── Floating panes ────────────────────────────────────────────────────────────
# new-pane, not display-popup: tmux repaints open overlays on background
# redraws, so a popup flickers while anything scrolls elsewhere (tmux/tmux#5336,
# fixed by PR #5398, not in 3.7c). Floating panes draw on the normal path.
# They close when their command exits. tmux-float.sh centres them — new-pane
# takes absolute sizes and positions only.
bind -N "Open lazygit" g run-shell "~/.config/tmux/scripts/tmux-float.sh 90 90 lazygit"
bind -N "Scratch shell" G run-shell "~/.config/tmux/scripts/tmux-float.sh 80 70"

# ── Jump to a window or pane ──────────────────────────────────────────────────
# Current session only: one session is one workspace here, so crossing sessions
# is `prefix w` (sesh). Replaces tmux's `f` (find-window), which prompts.
bind -N "Jump to a window or pane" f run-shell "~/.config/tmux/scripts/tmux-float.sh 70 60 ~/.config/tmux/scripts/tmux-jump.sh"

# ── Output ────────────────────────────────────────────────────────────────────
# e: scrollback into neovim (F/fuzzback searches it; this is for reading it).
# O: pipe-pane -o toggles, so the same key starts and stops logging.
bind -N "Scrollback in neovim" e run-shell "~/.config/tmux/scripts/tmux-scrollback.sh"
bind -N "Toggle pane logging" O run-shell "mkdir -p ~/.local/state/tmux" \; \
    pipe-pane -o "cat >> ~/.local/state/tmux/#{session_name}-#{window_index}.#{pane_index}.log" \; \
    display "#{?pane_pipe,logging -> ~/.local/state/tmux/#{session_name}-#{window_index}.#{pane_index}.log,logging stopped}"

# ── Status bar visibility ─────────────────────────────────────────────────────
# For screenshots and recordings.
bind -N "Toggle status bar" S if -F "#{==:#{status},off}" "set -g status on" "set -g status off"

bind -N "Kill window" & run-shell "~/.config/tmux/scripts/tmux-float.sh 50 30 ~/.config/tmux/scripts/tmux-confirm.sh \"Kill window \"#{q:window_name}\"?\" kill-window"
bind -N "tmux command palette" : run-shell "~/.config/tmux/scripts/tmux-float.sh 70 60 ~/.config/tmux/scripts/tmux-command-palette.sh"

# ── Replacing tmux's prompt-driven defaults ───────────────────────────────────
# command-prompt draws over the status bar; these get a floating pane instead.
# ' and / are superseded outright by the pickers above.
bind -N "Jump to a window or pane" "'" run-shell "~/.config/tmux/scripts/tmux-float.sh 70 60 ~/.config/tmux/scripts/tmux-jump.sh"
bind -N "Show key bindings" / run-shell "~/.config/tmux/scripts/tmux-float.sh 80 70 ~/.config/tmux/scripts/tmux-which-key.sh"
bind -N "Move window to index" . run-shell "~/.config/tmux/scripts/tmux-float.sh 50 20 ~/.config/tmux/scripts/tmux-input.sh 'Move window to index' '' 'move-window -t @@'"

# ── Reload config ─────────────────────────────────────────────────────────────
# tmux-autoreload also reloads on file save; this bind is a manual fallback.
bind -N "Reload tmux config" r source-file ~/.tmux.conf \; display "Config reloaded"

# ── Catppuccin theme ──────────────────────────────────────────────────────────
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "basic"
# "none" (NOT "default", which means the opaque mantle) sets status-style to
# tmux's `default`, so the status bar has no background of its own and Ghostty's
# translucent background shows through instead of an opaque #1e1e2e band.
set -g @catppuccin_status_background "none"
# post-tpm.conf replaces catppuccin's window formats; these apply only until it loads.
set -g @catppuccin_window_current_text "#{b:pane_current_path}"
set -g @catppuccin_window_text "#{b:pane_current_path}"

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status-left-length 100
set -g status-right-length 300

set -g status-left "#[fg=#{?client_prefix,#{@thm_red},#{@thm_overlay_0}},bg=default] #S #[fg=#{@thm_overlay_0}]│ #{E:@wk_idle}"


# Right: [text+icon: kbd cpu mem disk temp] [single icons: vpn focus net vol] [dynamic: battery] [date] [time]
set -g status-right "\
#{?client_prefix,#{E:@wk_hint},#{?pane_in_mode,#{E:@wk_hint_copy},\
#(~/.config/tmux/scripts/tmux-cpu.sh)\
#(~/.config/tmux/scripts/tmux-temp.sh)\
#(~/.config/tmux/scripts/tmux-memory.sh)\
#(~/.config/tmux/scripts/tmux-disk.sh)\
 \
#(~/.config/tmux/scripts/tmux-keyboard.sh)\
 \
#(~/.config/tmux/scripts/tmux-network.sh)\
#(~/.config/tmux/scripts/tmux-vpn.sh)\
 \
#(~/.config/tmux/scripts/tmux-focus.sh)\
#(~/.config/tmux/scripts/tmux-volume.sh)\
 \
#(~/.config/tmux/scripts/tmux-battery.sh)\
 \
#(~/.config/tmux/scripts/tmux-date.sh)\
#(~/.config/tmux/scripts/tmux-time.sh)}}"

# ── Key hints ─────────────────────────────────────────────────────────────────
# The hints take over the right-hand widget block while the prefix is held, and
# the copy-mode hints while a pane is in copy mode.
#
# While they are up the widget branch is not expanded, so tmux may let the #()
# jobs go idle and restart them afterwards.
set -g @wk_idle "#{?window_zoomed_flag,#[fg=#{@thm_yellow}] zoom #[fg=#{@thm_overlay_0}]│ ,}#{?pane_marked_set,#[fg=#{@thm_mauve}] marked #[fg=#{@thm_overlay_0}]│ ,}"

# Regenerate the hint strings whenever the config is (re)loaded, so a binding
# that goes away also goes away from the bar.
run-shell "~/.config/tmux/scripts/tmux-hint-bar.sh"

# ── Window naming ────────────────────────────────────────────────────────────
# tmux's own automatic-rename labels each window "dir | process"; post-tpm.conf
# sets the format. ofirgall/tmux-window-name used to do this, but it switched
# automatic-rename off on every new window and renamed only on select-window,
# so a new tab stayed "fish" until you left it and came back.

# ── URL picker (wfxr/tmux-fzf-url) ───────────────────────────────────────────
set -g @fzf-url-bind "u"
set -g @fzf-url-history-limit "2000"

# ── Copy hints (fcsonline/tmux-thumbs) ───────────────────────────────────────
set -g @thumbs-key "t"
set -g @thumbs-command "echo -n {} | pbcopy"

# ── Scrollback fuzzy search (roosta/tmux-fuzzback) ───────────────────────────
set -g @fuzzback-bind "F"

# ── Session persistence ───────────────────────────────────────────────────────
# No snapshot-and-restore (tmux-resurrect / tmux-continuum removed). The tmux
# server is a daemon: quitting Ghostty only detaches the client, so relaunching
# and attaching (autostart: `new-session -A -s main`) returns the EXACT live
# session — no staleness, no "random moment" restore.
#
# When the server actually dies (reboot, or exiting every shell) you get a clean
# fresh `main`; rebuild project sessions on demand with `prefix w` (sesh). This
# is deliberate: a full teardown means a clean slate, not a resurrected one.

# ── Plugins (TPM) ─────────────────────────────────────────────────────────────
# TPM bootstrap (one-time):
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#   Then launch tmux and press prefix + I
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin "catppuccin/tmux"
set -g @yank_action "copy-pipe-and-cancel"
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin "wfxr/tmux-fzf-url"
set -g @plugin "fcsonline/tmux-thumbs"
set -g @plugin "roosta/tmux-fuzzback"
set -g @plugin "b0o/tmux-autoreload"

run "~/.tmux/plugins/tpm/tpm"
run "tmux source-file ~/.config/tmux/post-tpm.conf"
