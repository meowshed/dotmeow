# Sourced after TPM so it wins over catppuccin's own window-status formats.
#
# Tab label: "#I dir | process"
#   - dir     - basename of the pane's cwd
#   - process - bare command name, omitted when it's just the shell (no "| fish")
#   - a manually renamed window (prefix ,) shows its name instead; tmux clears
#     `automatic-rename` on rename, which is what the conditionals below test.
#
# tmux's own automatic-rename keeps #W in step with the label, so pickers and
# the rename popup see the same text as the tab. Nothing else may toggle
# `automatic-rename`: it is the one flag that means "not renamed by hand".

# Matches the plain-shell case, whose name adds nothing to the dir.
set -g @_wn_shell "#{||:#{==:#{pane_current_command},fish},#{||:#{==:#{pane_current_command},bash},#{==:#{pane_current_command},zsh}}}"

# The label for the pane in context; the _c variant dims the process part.
set -g @_wn_label "#{b:pane_current_path}#{?#{E:@_wn_shell},, | #{pane_current_command}}"
set -g @_wn_label_c "#{b:pane_current_path}#[fg=#{@thm_overlay_2}]#{?#{E:@_wn_shell},, | #{pane_current_command}}"

# The label of the pane you work in. While a floating pane (picker, lazygit)
# is open it is the active pane, so the label comes from the tiled pane that
# was active before it, which tmux marks with pane_last.
set -g @_wn_auto "#{?pane_floating_flag,#{P:#{?#{&&:#{pane_last},#{!:#{pane_floating_flag}}},#{E:@_wn_label},}},#{E:@_wn_label}}"
set -g @_wn_auto_c "#{?pane_floating_flag,#{P:#{?#{&&:#{pane_last},#{!:#{pane_floating_flag}}},#{E:@_wn_label_c},}},#{E:@_wn_label_c}}"

set -g automatic-rename on
set -g automatic-rename-format "#{E:@_wn_auto}"

# catppuccin inverts the tab for activity and bell (bg=#b4befe), which punches
# an opaque block through the transparent bar. Flattened to `default`; the
# format below signals with the label's own colour instead.
set -g window-status-activity-style "default"
set -g window-status-bell-style "default"

set -g window-status-separator " "

set -g window-status-format "#[fg=#{?window_bell_flag,#{@thm_maroon},#{?window_activity_flag,#{@thm_flamingo},#{@thm_overlay_0}}},bg=default,none]#I #{?automatic-rename,#{E:@_wn_auto},#W}"

set -g window-status-current-format "#[fg=#{@thm_fg},bg=default,us=#{@thm_blue},underscore]#I #{?automatic-rename,#{E:@_wn_auto_c},#W}#[nounderscore]"

# ── Floating panes ────────────────────────────────────────────────────────────
# Pickers and lazygit are floating panes (see tmux.conf), so they take the pane
# border styles. catppuccin's lavender active border is too loud for a panel.
set -gF pane-active-border-style "fg=#{@thm_surface_2}"
set -gF pane-border-style "fg=#{@thm_surface_0}"
